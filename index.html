<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>適性検査センター</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="適性検査">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1f2937;--sub:#6b7280;--main:#2563eb;--main2:#dbeafe;--line:#e5e7eb;--teal:#14b8a6;--ok:#16a34a;--warn:#ca8a04;--ng:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--sub:#94a3b8;--main:#60a5fa;--main2:#1e3a5f;--line:#334155}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.wrap.wide{max-width:1040px}
.card{background:var(--card);border-radius:16px;padding:22px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:16px}
h1{font-size:24px;margin:0 0 8px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
p{margin:8px 0}.sub{color:var(--sub);font-size:13px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit}
textarea{min-height:90px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--main);color:#fff;font-size:16px;font-weight:700;margin-top:14px}
.btn.ghost{background:transparent;color:var(--main);border:1px solid var(--main)}
.btn.danger{background:var(--ng)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:4px 6px 0 0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tcard{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card)}
.tcard h2{margin:0 0 4px}
.ico{font-size:28px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main);transition:width .25s}
.q{font-size:18px;font-weight:600;margin:18px 0;white-space:pre-wrap}
.opts{display:grid;gap:8px}
.opt{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);text-align:left;font-size:15px}
.opt:hover,.opt.sel{border-color:var(--main);background:var(--main2)}
.nav{display:flex;gap:8px}
.tag{display:inline-block;background:var(--main2);color:var(--main);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700;margin:2px 4px 2px 0}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--main);text-decoration:underline;font-size:14px;padding:4px}
.hero{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center}
.hero>div{flex:1 1 220px;max-width:340px}
.rank{display:inline-flex;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:800;align-items:center;justify-content:center}
.row{display:grid;grid-template-columns:110px 1fr 150px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.row .v{text-align:right;white-space:nowrap}
.up{color:var(--ok)}.dn{color:var(--ng)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
tr.click:hover{background:var(--main2);cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--bg);border-radius:12px;padding:12px 14px}.kpi b{display:block;font-size:26px}
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden}
.stack span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:8px 12px;font-size:14px}
.good{background:#dcfce7;color:#166534;border-radius:10px;padding:8px 12px;font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
code.k{display:block;word-break:break-all;font-size:11px;background:var(--bg);padding:8px;border-radius:8px;max-height:90px;overflow:auto}
svg text{fill:var(--text);font-size:12px}
.rsub{margin:-6px 0 4px 120px}
table.wt{min-width:620px}table.wt td,table.wt th{white-space:nowrap}
@media (max-width:560px){.wrap{padding:12px 12px 50px}.card{padding:18px 14px}h1{font-size:21px}.row{grid-template-columns:1fr auto;gap:4px 10px}.row .bar{grid-column:1/-1;grid-row:2}.row .v{grid-column:2;grid-row:1;text-align:right}.rsub{margin-left:0}.opt{padding:15px 14px}.hero>div{flex-basis:100%;max-width:none}}
@media print{.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}
</style>

const BENCH0={hire:60,basic:60,staff:70,med:60};
const OPTS=["あてはまらない","あまりあてはまらない","どちらともいえない","ややあてはまる","あてはまる"];
const RC={A:"#16a34a",B:"#2563eb",C:"#ca8a04",D:"#ea580c",E:"#dc2626",F:"#991b1b"};

/* ============ ユーティリティ ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mainKeys=t=>Object.keys(TESTS[t].dims).filter(k=>!TESTS[t].dims[k].kind||TESTS[t].dims[k].kind==="main");
const pad=n=>String(n).padStart(2,"0");
const fdate=ts=>{const d=new Date(ts);return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fday=ts=>fdate(ts).slice(0,10);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function rk(t,o){if(t==="staff"){return o>=85?"A":o>=75?"B":o>=65?"C":o>=55?"D":o>=45?"E":"F"}return o>=80?"A":o>=65?"B":o>=50?"C":o>=35?"D":"E"}
const rkBadge=(t,o)=>{const r=rk(t,o);return `<span class="rank" style="background:${RC[r]}">${r}</span>`};
const level=p=>p>=80?"非常に高い":p>=60?"高い":p>=40?"標準":p>=20?"やや低い":"低い";
const sget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const sdel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const getDB=()=>sget("apt2-results",[]);
const setDB=d=>sset("apt2-results",d);
const getSet=()=>Object.assign({org:"",pass:null,show:true,bench:{}},sget("apt2-settings",{}));
const setSet=s=>sset("apt2-settings",s);
const bench=t=>{const s=getSet();return s.bench&&s.bench[t]!=null?+s.bench[t]:BENCH0[t]};
async function hashPw(s){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("apt2:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return "w"+(h>>>0)}
const enc=r=>"APT1:"+btoa(unescape(encodeURIComponent(JSON.stringify(r))));
function dec(tok){tok=tok.trim();if(!tok.startsWith("APT1:"))return null;try{const r=JSON.parse(decodeURIComponent(escape(atob(tok.slice(5)))));return r&&TESTS[r.t]&&r.id&&r.s?r:null}catch(e){return null}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============ グラフ(SVG) ============ */
function ring(score,t){const r=rk(t,score),R=60,C=2*Math.PI*R;
 return `<svg viewBox="0 0 160 160" style="width:100%;max-width:200px"><circle cx="80" cy="80" r="${R}" fill="none" stroke="#e5e7eb" stroke-width="14"/><circle cx="80" cy="80" r="${R}" fill="none" stroke="#14b8a6" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*score/100} ${C}" transform="rotate(-90 80 80)"/><text x="80" y="92" text-anchor="middle" style="font-size:40px;font-weight:700;fill:#14b8a6">${score}</text><circle cx="30" cy="28" r="15" fill="${RC[r]}"/><text x="30" y="34" text-anchor="middle" style="fill:#fff;font-size:17px;font-weight:800">${r}</text></svg>`}
function radar(names,vals,vals2){const n=names.length,cx=200,cy=190,R=120;
 const pt=(i,r)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};let g="";
 [.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${names.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="#9ca3af" opacity=".35"/>`});
 names.forEach((nm,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#9ca3af" opacity=".35"/>`;const[lx,ly]=pt(i,R+28);g+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${esc(nm)}</text>`});
 if(vals2)g+=`<polygon points="${vals2.map((v,i)=>pt(i,R*v/100).join(",")).join(" ")}" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>`;
 g+=`<polygon points="${vals.map((v,i)=>pt(i,R*v/100).join(",")).join(" ")}" fill="#14b8a6" fill-opacity=".3" stroke="#14b8a6" stroke-width="2"/>`;
 vals.forEach((v,i)=>{const[x,y]=pt(i,R*v/100);g+=`<circle cx="${x}" cy="${y}" r="4" fill="#14b8a6"/>`});
 return `<svg viewBox="0 0 400 380" style="width:100%"><title>レーダーチャート</title>${g}</svg>`}
function line(points,mn,mx,bm){ // points:[{l,y}]
 const W=420,H=190,pl=34,pr=12,pt=12,pb=28;if(!points.length)return "";
 const X=i=>pl+(points.length===1?(W-pl-pr)/2:(W-pl-pr)*i/(points.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));let g="";
 for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#9ca3af" opacity=".3"/><text x="${pl-5}" y="${y+4}" text-anchor="end" style="font-size:10px">${Math.round(v)}</text>`}
 if(bm!=null)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(bm)}" y2="${Y(bm)}" stroke="#eab308" stroke-dasharray="4 3"/>`;
 g+=`<polyline fill="none" stroke="#14b8a6" stroke-width="2.5" points="${points.map((p,i)=>X(i)+","+Y(p.y)).join(" ")}"/>`;
 points.forEach((p,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="#14b8a6"/><text x="${X(i)}" y="${H-8}" text-anchor="middle" style="font-size:10px">${esc(p.l)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><title>スコアの推移</title>${g}</svg>`}

/* ============ 採点 ============ */
function buildQs(t){const out=[];let id=0;const D=TESTS[t].dims;for(const k in D)if(D[k].q)D[k].q.forEach(x=>out.push({id:id++,dim:k,text:x[0],rev:!!x[1]}));return out}
function scoreLikert(t,qs,ans){const D=TESTS[t].dims,s={};
 for(const k in D){const q=qs.filter(x=>x.dim===k);if(!q.length)continue;const kind=D[k].kind;
  const sum=q.reduce((a,x)=>a+((x.rev&&kind!=="valid"&&kind!=="risk")?4-ans[x.id]:ans[x.id]),0);s[k]=Math.round(sum/(q.length*4)*100)}
 const mk=mainKeys(t),vals=qs.filter(x=>mk.includes(x.dim)).map(x=>ans[x.id]);
 const cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);
 return {s,o:Math.round(mean(mk.map(k=>s[k]))),x:{sl:Math.max(...Object.values(cnt))>=vals.length*0.9}}}
function prevOf(r){const nm=(r.n||"").trim().toLowerCase();if(!nm)return null;return getDB().filter(x=>x.t===r.t&&x.id!==r.id&&(x.n||"").trim().toLowerCase()===nm&&x.ts<r.ts).sort((a,b)=>b.ts-a.ts)[0]||null}
function orgAvg(t,exclId){const d=getDB().filter(x=>x.t===t&&x.id!==exclId);if(d.length<3)return null;const a={};Object.keys(TESTS[t].dims).forEach(k=>{const v=d.filter(x=>x.s[k]!=null).map(x=>x.s[k]);if(v.length)a[k]=Math.round(mean(v))});a._o=Math.round(mean(d.map(x=>x.o)));a._n=d.length;return a}

/* ============ 結果画面 ============ */
function resultView(r,adm){
 const T=TESTS[r.t],D=T.dims,mk=mainKeys(r.t),prev=prevOf(r),avg=orgAvg(r.t,r.id),bm=bench(r.t);
 const diff=(a,b)=>{const d=a-b;return d===0?`<span class="sub">±0</span>`:`<span class="${d>0?"up":"dn"}">${d>0?"▲+":"▼"}${d}</span>`};
 let h=`<div class="card"><div class="sub">${esc(T.name)} / ${fdate(r.ts)}${r.d?" / "+esc(r.d):""}${r.r?" / "+esc(r.r):""}</div><h1>${esc(r.n||"受検者")} さんの結果</h1>
 <div class="hero"><div style="text-align:center">${ring(r.o,r.t)}<div class="sub">総合スコア ${r.o}</div><div class="sub">ベンチマーク ${bm}(${diff(r.o,bm)})</div>${prev?`<div class="sub">前回(${fday(prev.ts)}) ${prev.o} → ${diff(r.o,prev.o)}</div>`:""}</div>
 <div>${radar(mk.map(k=>D[k].n),mk.map(k=>r.s[k]),avg?mk.map(k=>avg[k]):null)}${avg?`<div class="sub" style="text-align:center">点線=自社平均(${avg._n}件)</div>`:""}</div></div></div>`;
 h+=`<div class="card"><h2>${r.t==="basic"?"科目別の結果":"項目別スコア"}</h2>`;
 mk.forEach(k=>{const v=r.s[k];
  let right=`${v}点 ${r.t==="basic"?"":"("+level(v)+")"}`;
  if(r.t==="basic"&&r.x&&r.x.raw&&r.x.raw[k])right=`${r.x.raw[k][0]}/${r.x.raw[k][1]}問 (${v}%)`;
  const extra=(prev&&prev.s[k]!=null?` 前回比${diff(v,prev.s[k])}`:"")+(avg&&avg[k]!=null?` 平均比${diff(v,avg[k])}`:"");
  h+=`<div class="row"><div><b>${D[k].n}</b></div><div class="bar"><i style="width:${v}%"></i></div><div class="v">${right}</div></div><div class="sub rsub">${esc(D[k].d)}${extra}</div>`});
 h+=`</div>`;
 if(r.t==="basic"&&r.x&&r.x.secs!=null)h+=`<div class="card"><p>所要時間:${Math.floor(r.x.secs/60)}分${r.x.secs%60}秒 / 受検科目数:${mk.length}</p><p class="sub">${r.x.timeout?"時間切れで自動提出された科目があります。":""}正答率の目安: 80%以上=高い、50〜79%=標準、49%以下=基礎の復習が必要。</p></div>`;
 const motiv=Object.keys(D).filter(k=>D[k].kind==="motiv");
 if(motiv.length){const top=motiv.slice().sort((a,b)=>r.s[b]-r.s[a])[0];
  h+=`<div class="card"><h2>モチベーション(仕事の価値観)</h2><p>最も強い志向は <b>${esc(D[top].n)}</b> です。</p>`+motiv.map(k=>`<div class="row"><div>${esc(D[k].n)}</div><div class="bar"><i style="width:${r.s[k]}%;background:var(--teal)"></i></div><div class="v">${r.s[k]}点</div></div>`).join("")+`<p class="sub">入社後の配置・育成・動機づけの参考にしてください。</p></div>`}
 if(T.jobs){const fit=Object.entries(T.jobs).map(([j,w])=>[j,Math.round(Object.entries(w).reduce((a,[k,x])=>a+x*r.s[k],0))]).sort((a,b)=>b[1]-a[1]);
  h+=`<div class="card"><h2>${r.t==="med"?"向いている職場・役割":"職種適合度"}</h2>`+fit.map((f,i)=>`<div class="row"><div>${i<2?"★ ":""}${esc(f[0])}</div><div class="bar"><i style="width:${f[1]}%;background:${i<2?"var(--teal)":"var(--main)"}"></i></div><div class="v">${f[1]}%</div></div>`).join("")+`</div>`}
 if(r.x&&r.x.v!=null){const v=r.x.v,bad=v>=85,mid=v>=70;
  h+=`<div class="card"><h2>回答の信頼性</h2><div class="${bad?"warn":mid?"warn":"good"}">${bad?"⚠ 自分をよく見せようとした回答傾向が強く、結果の解釈に注意が必要です。":mid?"やや良く見せようとする傾向があります。面接で確認すると安心です。":"信頼できる回答です。"} (信頼係数 ${100-v})</div>${r.x.sl?`<div class="warn" style="margin-top:8px">⚠ 同じ選択肢に回答が偏っています。集中して回答していない可能性があります。</div>`:""}</div>`}
 if(r.x&&r.x.risk!=null){const v=r.x.risk,lv=v>=60?["高","warn"]:v>=30?["中","warn"]:["低","good"];
  h+=`<div class="card"><h2>離職リスク</h2><div class="${lv[1]}">離職リスク:<b>${lv[0]}</b>(${v}点)</div></div>`}
 const low=mk.slice().sort((a,b)=>r.s[a]-r.s[b]).slice(0,2);
 if(r.t==="staff"||r.t==="basic"){ if(r.t==="staff")h+=`<div class="card"><h2>改善のヒント(スコアが低い項目)</h2>`+low.map(k=>`<p><b>${D[k].n}(${r.s[k]}点)</b><br>${esc(D[k].a)}</p>`).join("")+`</div>`;
  else h+=`<div class="card"><h2>学習のヒント</h2><p>最も伸びしろがあるのは「${D[low[0]].n}」です。問題集で基礎を復習し、時間を計って解く練習をしましょう。</p></div>`}
 else{ if(adm){const lows=mk.filter(k=>r.s[k]<45);
  h+=`<div class="card"><h2>面接で確認したいポイント</h2>`+(lows.length?lows.map(k=>`<p><b>${D[k].n}(${r.s[k]}点)</b><br>${esc(D[k].h)}</p>`).join(""):`<p>低い項目はありません。強みの具体例(「${D[mk.slice().sort((a,b)=>r.s[b]-r.s[a])[0]].n}」)を深掘りしましょう。</p>`)+`</div>`}
  else h+=`<div class="card"><h2>伸ばすヒント</h2><p>最も伸びしろがあるのは「${D[low[0]].n}」です。${esc(D[low[0]].a)}。</p></div>`}
 h+=`<div class="card noprint"><details><summary>結果コード(管理者へ送る用)</summary><p class="sub">このコードを管理者に送ると、管理画面で結果を取り込めます。</p><code class="k" id="code">${enc(r)}</code><button class="btn ghost sm" onclick="copyCode()">コピー</button></details></div>`;
 return h}
function copyCode(){const t=$("code").textContent;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("コピーしました"));else{const s=window.getSelection(),rg=document.createRange();rg.selectNodeContents($("code"));s.removeAllRanges();s.addRange(rg);document.execCommand("copy");alert("コピーしました")}}

 const rn=()=>{let x=0;for(let i=0;i<4;i++)x+=Math.random();return (x-2)*18};const cl=v=>Math.max(5,Math.min(98,Math.round(v)));
 Object.keys(TESTS).forEach(t=>{const T=TESTS[t];for(let i=0;i<12;i++){const base=58+rn(),s={},ts=Date.now()-Math.floor(Math.random()*150)*864e5,x={};
  Object.keys(T.dims).forEach(k=>{const kd=T.dims[k].kind;s[k]=kd==="valid"?cl(35+Math.random()*50):kd==="risk"?cl(Math.random()*80):cl(base+rn()*0.9)});
  if(t==="basic"){x.raw={};Object.keys(T.dims).forEach(k=>{const c=Math.max(0,Math.min(8,Math.round(s[k]/100*8)));x.raw[k]=[c,8];s[k]=Math.round(c/8*100)});x.secs=700+Math.floor(Math.random()*900)}
